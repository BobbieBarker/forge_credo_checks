name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: the `elixir: "~> 1.18"` requirement declared in mix.exs.
          - elixir: "1.18.4"
            otp: "27.2"
          # Consumer: the version forge-symphony builds against.
          - elixir: "1.20.1"
            otp: "28.2"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix credo --strict

      - run: mix test

      # Formatter output can differ across Elixir versions, so check it on the
      # single version the library is developed against rather than the matrix.
      - name: Check formatting
        if: matrix.elixir == '1.20.1'
        run: mix format --check-formatted
